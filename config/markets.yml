# Ein Markt = ein Shop = eine Waehrung. Die Waehrung wird bei jedem Lauf gegen die
# Antwort des Shops geprueft; weicht sie ab, bricht der Markt-Lauf ab (Alert). Ein
# stillschweigend in der falschen Waehrung gefuehrter Referenzpreis waere eine falsche
# Werbeaussage, kein Schoenheitsfehler.
markets:
