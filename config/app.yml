# frozen = Gesetzeswortlaut (§ 11 PAngV): niedrigster Preis der 30 Tage VOR Beginn der
# Ermaessigung, waehrend der Aktion eingefroren.
# rolling = stumpfes Minimum ueber [heute-30, gestern]. Nur als bewusste Rueckfallebene;
# ab dem zweiten Aktionstag wandert der Aktionspreis selbst ins Fenster und die
# ausgewiesene Ersparnis laeuft gegen null.
calculation_mode: frozen

window_days: 30
# promo -> normal, wenn der gesenkte Preis so lange unveraendert steht.
# MUSS groesser sein als die laengste geplante Aktionsdauer. Sonst kippt die Referenz
# mitten in einer langen Aktion auf den Aktionspreis — gemessen im Test: Bei 30 Tagen
# faellt eine 35-Tage-Aktion faelschlich auf 99,00 statt korrekt auf 119,00 zu bleiben.
#
# ES GIBT KEIN AKTIONSKENNZEICHEN und es soll auch keines geben (Entscheidung GRUBE,
# 18.08.2026): Aktionen koennen aus verschiedenen Stellen stammen, ein Kennzeichen aus
# nur einer davon waere schlimmer als keines. Diese Grenze ist damit dauerhaft tragend,
# nicht uebergangsweise — es gibt keine Einstellung ohne Nachteil, nur eine bewusst
# gewaehlte:
#   zu niedrig -> die Referenz kippt mitten in einer langen Aktion auf den Aktionspreis
#   zu hoch    -> eine echte Dauersenkung schleppt monatelang eine ueberholte Referenz
# TODO(setup): laengste tatsaechlich geplante Aktionsdauer erfragen und hier daruebersetzen.
permanent_after_days: 60

# Vorstufen-Anker PREV_NET/PREV_GROSS (§ 6.4): der Preis der unmittelbaren Vorstufe als
# eigener Streichpreis fuer Abverkaufs-Preistreppen. Freiwilliges Frontend-Futter — die
# rechtliche Basis bleiben die 30_*-Werte, die davon voellig unabhaengig laufen.
prev_price_enabled: true
# Leerung des Ankers X Tage nach der letzten Senkung: Ein alter eigener Preis taugt nur
# begrenzte Zeit als Streichpreis (UWG-Verschleiss). Konservativ gewaehlt, VON LEGAL ZU
# KALIBRIEREN. Jede weitere Senkung setzt den Timer zurueck.
prev_price_max_days: 42

anomaly_alert_threshold: 50     # verworfene Datensaetze je Lauf bis Alert
batch_size: 100                 # Artikel je iSHOP-Request
max_write_retries: 3

alert_email: TODO
run_after: "05:30"              # NACH dem DiVA-Preisimport — TODO(setup): Importzeitpunkt

# true = rechnen und protokollieren, aber NICHT in den PSS schreiben.
# Auslieferungszustand ist der Trockenmodus: Scharfschalten ist eine bewusste Handlung.
dry_run: true
